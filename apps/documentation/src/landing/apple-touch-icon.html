<!doctype html>
<!-- Source of apps/documentation/public/apple-touch-icon.png (180 x 180): the mark, full-bleed, since iOS rounds the corners itself. -->
<html>
  <body style="margin: 0">
    <svg width="180" height="180" viewBox="0 0 32 32" style="display: block">
      <defs>
        <linearGradient id="f" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#4a7dff" />
          <stop offset="1" stop-color="#1e4fd6" />
        </linearGradient>
      </defs>
      <rect width="32" height="32" fill="url(#f)" />
      <rect
        x="10"
        y="6"
        width="12"
        height="20"
        rx="3.5"
        fill="none"
        stroke="#fff"
        stroke-width="2"
      />
      <circle cx="16" cy="16" r="3.75" fill="#fff" />
    </svg>
  </body>
</html>
