name: Set up the workspace
description: pnpm, Node, and a frozen install. Shared by every workflow so they resolve the same tree.

inputs:
  registry-url:
    description: Passed to setup-node, which writes an .npmrc for it. Only the release sets it.
    required: false
    default: ''

runs:
  using: composite
  steps:
    # Reads the version from the root `packageManager` field, so CI and a laptop resolve the
    # same tree.
    - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
    - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
      with:
        node-version: 24
        cache: pnpm
        registry-url: ${{ inputs.registry-url }}

    # Frozen: CI fails on a lockfile that does not match the manifests rather than quietly
    # resolving something newer, which is how the Reanimated version drifted off Expo's set.
    - run: pnpm install --frozen-lockfile
      shell: bash
