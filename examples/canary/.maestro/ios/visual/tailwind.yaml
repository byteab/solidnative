# Tailwind, as it draws: a screenshot compared with the one taken when it was last right.
#
# Stricter than the other screens: nothing here moves, so a run matches its baseline pixel for pixel,
# and what it guards is small. A ring in the wrong colour is 0.09% of the screen and a lost text
# shadow 0.03%, both of which a 97% threshold lets through.
appId: dev.solidnative.canary
---
- runFlow:
    file: ../subflows/open.yaml
    env:
      SCREEN: 'Tailwind'
- waitForAnimationToEnd
- assertScreenshot:
    path: ../baselines/visual-tailwind.png
    thresholdPercentage: 99.99
