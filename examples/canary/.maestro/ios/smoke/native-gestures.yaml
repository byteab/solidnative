# Native gestures: opens by its deep link, draws no error screen, and shows what it is.
appId: dev.solidnative.canary
---
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      PATH: native-gestures
- assertVisible: 'Native gestures'
- scrollUntilVisible:
    element: 'drag me.*'
    timeout: 10000
- scroll
- runFlow: ../../subflows/no-error-screen.yaml
