# Typography: opens by its deep link, draws no error screen, and shows what it is.
appId: dev.solidnative.canary
---
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      PATH: typography
- assertVisible: 'Typography'
- scrollUntilVisible:
    element: "Slanted, from the family's own italic cut.*"
    timeout: 10000
- scroll
- runFlow: ../../subflows/no-error-screen.yaml
