# SwiftUI controls: opens by its deep link, draws no error screen, and shows what it is.
appId: dev.solidnative.canary
---
- runFlow:
    file: ../subflows/open-link.yaml
    env:
      PATH: expo-ui
- assertVisible: 'SwiftUI controls'
- scrollUntilVisible:
    element: 'set it from Solid.*'
    timeout: 10000
- scroll
- runFlow: ../../subflows/no-error-screen.yaml
